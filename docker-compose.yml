version: '3.8'
services:
  # === MySQL 数据库 ===
  mysql:
    image: mysql:8.0
    container_name: yunwei-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Wh111852}
      MYSQL_DATABASE: gms
      MYSQL_USER: Wuzhenyu
      MYSQL_PASSWORD: ${DB_PASSWORD:-Wh111852}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    command: >
      --max_connections=500
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=256M
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Redis 缓存 ===
  redis:
    image: redis:7-alpine
    container_name: yunwei-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # === Node.js 应用 ===
  app:
    build: .
    container_name: yunwei-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8765
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: Wuzhenyu
      DB_PASSWORD: ${DB_PASSWORD:-Wh111852}
      DB_NAME: gms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FEISHU_APP_ID: cli_aaa42355f0389cfc
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-v2vU8YCrU0GHJdUsIa8nN1edaEGdkPm8}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - uploads_data:/app/uploads
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8765/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === Nginx 反向代理 ===
  nginx:
    image: nginx:alpine
    container_name: yunwei-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  uploads_data:
