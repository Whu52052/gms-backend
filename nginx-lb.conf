# ===================================================================
#  Yunwei Nginx 负载均衡配置
#  适用: 一台 Nginx 转发 → 多台 Node.js 服务器
#
#  服务器规划:
#    服务器 A: 192.168.1.233:8765 (主)
#    服务器 B: 192.168.1.234:8765 (从)
#    服务器 C: 192.168.1.235:8765 (从) — 可选
#
#  数据库:
#    MySQL 主库: 192.168.1.233:3306 (读写)
#    MySQL 从库: 192.168.1.234:3306 (只读)
#    Redis:      192.168.1.233:6379 (Session 共享)
# ===================================================================

worker_processes auto;
worker_connections 4096;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr rt=$upstream_response_time';
    access_log /var/log/nginx/yunwei-access.log main;
    error_log /var/log/nginx/yunwei-error.log warn;

    # 性能
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 200m;

    # Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json;

    # ========== 上游服务器组 ==========
    upstream yunwei_backend {
        # 负载均衡算法: least_conn (最少连接数)
        least_conn;

        server 192.168.1.233:8765 weight=3 max_fails=3 fail_timeout=30s;  # 主服务器(权重高)
        server 192.168.1.234:8765 weight=2 max_fails=3 fail_timeout=30s;  # 从服务器
        # server 192.168.1.235:8765 weight=1 max_fails=3 fail_timeout=30s;  # 第三台(可选)

        keepalive 256;  # 保持256个空闲连接
    }

    # ========== 主站点 ==========
    server {
        listen 80;
        server_name _;

        # 速率限制
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
        limit_conn_zone $binary_remote_addr zone=conn:10m;
        limit_conn conn 50;

        # ===== API 代理 =====
        location /api/ {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # ===== SSE 实时推送 =====
        location = /api/events {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;

            # 长连接: 禁用重试(否则切换服务器会断连)
            proxy_next_upstream off;
        }

        # 兼容旧客户端
        location = /api/sse {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_next_upstream off;
        }

        # ===== WebSocket =====
        location /ws {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_next_upstream off;
        }

        # ===== 静态文件 =====
        location / {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ===== 健康检查 =====
        location /nginx-health {
            access_log off;
            return 200 "OK";
        }
    }
}
