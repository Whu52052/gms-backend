# ===================================================================
#  Yunwei 告警规则
#  触发条件 + 通知渠道 (企业微信/邮件)
# ===================================================================
groups:
  - name: yunwei-critical
    interval: 30s
    rules:
      # === 服务可用性 ===
      - alert: ServiceDown
        expr: up{job="yunwei-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '🚨 Yunwei 服务不可用'
          description: 'Yunwei 应用已停止响应超过1分钟，请立即检查！'

      # === 高延迟 ===
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '⚠️ API P95延迟 > 3秒'
          description: '过去5分钟内API P95延迟为 {{ $value }}秒'

      # === 高错误率 ===
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: '🚨 HTTP 5xx 错误率 > 5%'
          description: '5xx错误率 {{ $value | humanizePercentage }}'

      # === SSE 连接异常 ===
      - alert: SSEDrop
        expr: rate(sse_disconnections_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '⚠️ SSE 连接大量断开'
          description: 'SSE断连速率 {{ $value }}/秒'

      # === MySQL 连接池耗尽 ===
      - alert: MySQLPoolExhausted
        expr: mysql_connection_pool_wait_count > 50
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '🚨 MySQL 连接池排队 > 50'
          description: '数据库连接池不足, 排队数: {{ $value }}'

      # === Redis 不可用 ===
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '🚨 Redis 不可用'
          description: 'Redis 已断开, 系统降级运行中'

      # === 内存使用过高 ===
      - alert: HighMemory
        expr: node_memory_usage_percent > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '⚠️ 内存使用率 > 85%'
          description: '内存使用率 {{ $value }}%'

      # === 磁盘空间不足 ===
      - alert: LowDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '🚨 磁盘空间 < 15%'
          description: '磁盘剩余空间仅 {{ $value | humanizePercentage }}'

      # === 飞书队列积压 ===
      - alert: FeishuQueueBacklog
        expr: feishu_queue_size > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '⚠️ 飞书同步队列积压 > 50条'
          description: '飞书同步队列积压 {{ $value }} 条, 可能外网不通'

      # === 在线用户异常 ===
      - alert: UserSurge
        expr: online_users_total > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '⚠️ 在线用户数 > 600'
          description: '在线用户数 {{ $value }}, 可能超出设计容量'
