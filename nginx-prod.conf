# ===================================================================
#  Yunwei Nginx Production Config — i9 Workstation Edition
#
#  特性:
#    - HTTP/2 + SSL/TLS 1.3
#    - Gzip/Brotli 双压缩
#    - 静态资源 CDN 级缓存 (1年)
#    - API 反向代理 + 负载均衡
#    - SSE 长连接优化 (500并发)
#    - WebSocket 升级支持
#    - 安全头 + WAF 基础规则
#    - 限流 (limit_req / limit_conn)
#    - 访问日志 JSON 格式 (适配 ELK)
#    - 健康检查端点
# ===================================================================

user nginx;
worker_processes auto;
worker_cpu_affinity auto;           # CPU 亲和性绑定
worker_rlimit_nofile 65535;         # 最大文件描述符
pid /var/run/nginx.pid;

# ==================== EVENTS ====================
events {
    worker_connections 4096;         # 每 Worker 4096 连接
    use epoll;
    multi_accept on;                 # 同时接受多个连接
    accept_mutex off;                # i9 高频CPU, 关闭互斥锁
}

# ==================== HTTP ====================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- 日志格式 (JSON, 适配 ELK/Loki) ----
    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"real_ip":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
        '}';

    access_log /var/log/nginx/access.log json buffer=64k flush=10s;
    error_log /var/log/nginx/error.log warn;

    # ---- 基础性能优化 ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 2000;
    client_max_body_size 200m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;
    reset_timedout_connection on;
    server_tokens off;                    # 隐藏 Nginx 版本

    # ---- DNS 解析缓存 ----
    resolver 127.0.0.11 valid=30s ipv6=off;  # Docker DNS
    resolver_timeout 5s;

    # ---- 限流配置 ----
    # 全局请求限流: 1000 req/s burst 200
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
    # 登录限流: 10 req/min
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    # 并发连接限流: 每IP 50连接
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml;
    gzip_disable "msie6";

    # ---- Brotli 压缩 (更高压缩比) ----
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # ---- 上游服务器组 ----
    upstream yunwei_backend {
        least_conn;                      # 最少连接负载均衡
        server yunwei-app:8765 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 256;                   # 保持256个空闲连接
        keepalive_requests 10000;
        keepalive_timeout 120s;
    }

    # ---- 健康检查状态页面 ----
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }

    # ---- HTTP → HTTPS 重定向 (如需HTTPS) ----
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ==================== 主站点 ====================
    server {
        listen 80;
        # listen 443 ssl http2;
        server_name _;

        # ---- SSL 配置 (如需) ----
        # ssl_certificate /etc/nginx/certs/yunwei.crt;
        # ssl_certificate_key /etc/nginx/certs/yunwei.key;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;
        # ssl_session_tickets off;

        # ---- 安全头 ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- 全局限流 ----
        # limit_req zone=api_limit burst=200 nodelay;
        limit_conn conn_limit 100;

        # ========== 静态资源 (长期缓存) ==========
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CDN 级缓存
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            etag on;

            # 不记录静态资源日志
            access_log off;
        }

        # ========== SSE 端点 (实时推送) ==========
        location /api/sse {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 核心配置
            proxy_buffering off;              # 必须关闭缓冲
            proxy_cache off;                  # 必须关闭缓存
            proxy_read_timeout 86400s;        # 24h 超时
            proxy_send_timeout 86400s;
            chunked_transfer_encoding on;

            # 禁用压缩 (SSE 不支持)
            gzip off;

            # 限流放宽 (SSE 不占用大量请求)
            # limit_req zone=api_limit burst=1000 nodelay;
        }

        # ========== WebSocket 端点 ==========
        location /ws {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ========== API 代理 ==========
        location /api/ {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 32k;
        }

        # ========== API 健康检查 ==========
        location /api/health {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ========== Prometheus 指标 ==========
        location /api/metrics {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;      # Docker 网络
            allow 192.168.0.0/16;     # 内网
            deny all;
        }

        # ========== 默认 (SPA 兜底) ==========
        location / {
            proxy_pass http://yunwei_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ========== 禁止访问隐藏文件 ==========
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ========== 禁止访问敏感路径 ==========
        location ~* (\.sql|\.md|\.yml|\.yaml|Dockerfile|docker-compose)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
